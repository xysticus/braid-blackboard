# Publie la page web (web/) sur GitHub Pages. web/ardoise_lib.js (l'OCaml compilé en JavaScript) est suivi par git : il est
# construit chez soi par web/construit.sh (à relancer avant de commiter quand l'OCaml change) ; ici, rien n'est compilé,
# les fichiers sont seulement copiés. Réglage à faire une fois : Settings → Pages → Source : « GitHub Actions ».
name: Page web

# Déclenchement manuel seulement (onglet Actions → Page web → Run workflow) : plus de lancement à chaque poussée.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publie:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble le site
        run: |
          mkdir _site
          cp web/index.html web/ardoise.css web/ardoise.js web/travail.js web/ardoise_lib.js _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
