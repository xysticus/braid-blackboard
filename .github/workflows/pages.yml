# Publie la page web (web/) sur GitHub Pages. web/ardoise_lib.js (l'OCaml compilé en JavaScript) est suivi par git : il est
# construit chez soi par web/construit.sh (à relancer avant de commiter quand l'OCaml change) ; ici, rien n'est compilé,
# les fichiers sont seulement copiés. Réglage à faire une fois : Settings → Pages → Source : « GitHub Actions ».
name: Page web

# Lancé par chaque push sur master qui touche web/ (le hook .githooks/pre-push a reconstruit ardoise_lib.js avant) ; aussi à la main
# (onglet Actions → Page web → Run workflow).
on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publie:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble le site
        run: |
          mkdir _site
          cp web/index.html web/ardoise.css web/ardoise.js web/exports.js web/mp4.js web/travail.js web/ardoise_lib.js web/favicon.svg _site/
          mkdir _site/schemas && cp web/schemas/*.svg _site/schemas/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Une pause avant le dépôt : l'archive vient d'être créée et l'API de GitHub ne la voit parfois pas encore (« Found 0 artifact(s) »,
      # « No artifacts named "github-pages" »), ce qui faisait échouer le dépôt (vu presque à chaque push le 2026-11-23).
      - name: Laisse l'archive devenir visible
        run: sleep 20
      - id: deploiement
        uses: actions/deploy-pages@v4
