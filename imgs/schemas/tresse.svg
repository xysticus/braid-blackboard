<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
<title>Diagramme de tresse</title>
<defs>
<marker id="pointe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker>
</defs>
<rect width="440" height="250" fill="#ffffff"/>
<text x="100" y="26" text-anchor="middle" font-size="14" fill="#1d2330" font-weight="600">un croisement</text>
<text x="100" y="44" text-anchor="middle" font-size="12" fill="#626b7d" >deux brins qui s'échangent</text>
