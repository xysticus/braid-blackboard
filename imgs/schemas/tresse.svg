<text x="152" y="182" text-anchor="middle" font-size="16" fill="#1d2330" font-weight="600">σᵢ⁻¹</text>
<text x="152" y="202" text-anchor="middle" font-size="11" fill="#626b7d" >le brin de gauche</text>
<text x="152" y="216" text-anchor="middle" font-size="11" fill="#626b7d" >passe dessus</text>
<text x="335" y="26" text-anchor="middle" font-size="14" fill="#1d2330" font-weight="600">un mot de tresse</text>
<text x="335" y="44" text-anchor="middle" font-size="12" fill="#626b7d" >lu de haut en bas : σ₁ σ₂⁻¹</text>
