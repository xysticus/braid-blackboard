<text x="240" y="172" text-anchor="middle" font-size="14" fill="#1d2330" font-weight="600">σ₂⁻¹</text>
<path d="M424,67 L424,187" stroke="#1d2330" stroke-width="1.6" fill="none" marker-end="url(#pointe)"/>
<text x="220" y="240" text-anchor="middle" font-size="12" fill="#626b7d" >un brin de même couleur du haut au bas : les couleurs suivent les brins</text>
